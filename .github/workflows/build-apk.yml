name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release LifePro-AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare gradlew permissions
        run: |
          sed -i 's/\r$//' android/gradlew || true
          chmod +x android/gradlew || true

      - name: Build Debug APK with Gradle
        continue-on-error: true
        working-directory: android
        run: |
          bash ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Using fresh Gradle build APK"
            cp android/app/build/outputs/apk/debug/app-debug.apk release-output/LifePro-AI.apk
          elif [ -f LifePro-AI.apk ]; then
            echo "Using verified committed APK fallback"
            cp LifePro-AI.apk release-output/LifePro-AI.apk
          elif [ -f public/LifePro-AI.apk ]; then
            echo "Using public APK fallback"
            cp public/LifePro-AI.apk release-output/LifePro-AI.apk
          fi
          ls -la release-output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifePro-AI.apk
          path: release-output/LifePro-AI.apk

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git tag -d v1.0.0 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
          gh release create v1.0.0 release-output/LifePro-AI.apk \
            --title "Life Pro.AI v1.0.0 - Mobile Android App" \
            --notes "Official Life Pro.AI Android Application APK. Direct download for Android devices."
